<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tháp Xoắn Ốc — Triết học Mác – Lênin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#07080c;
    font-family:'Inter','Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    color:#e8e6e1; }
  canvas { display:block; }
  #stage { position:fixed; inset:0; }

  /* ═══ HUD ═══ */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #roomTag { position:absolute; top:22px; left:24px; }
  #tagKicker { font-size:11px; letter-spacing:.24em; color:#8a8d99; text-transform:uppercase; }
  #tagTitle  { font-size:19px; font-weight:600; letter-spacing:.02em; margin-top:4px; color:#f2efe9; }

  #cross { position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:#fff; opacity:.5; transition:opacity .25s, transform .25s; }
  #cross.hot { opacity:1; transform:scale(1.9); background:#ffb469; }

  #hint { position:absolute; left:50%; bottom:190px; transform:translateX(-50%);
    font-size:12.5px; color:#9b9ea9; letter-spacing:.03em; opacity:0; transition:opacity .3s;
    text-align:center; }
  #hint.on { opacity:1; }
  kbd { font:inherit; font-weight:600; color:#f2efe9; background:#1b1d26; border:1px solid #2d3040;
    border-radius:4px; padding:1px 6px; margin:0 1px; }

  /* ═══ bảng chỉ số ═══ */
  #panel { position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    width:min(620px, calc(100vw - 32px)); opacity:0; transition:opacity .35s; }
  #panel.on { opacity:1; }

  .readout { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:10px; }
  .temp { font-size:44px; font-weight:300; line-height:1; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; }
  .temp span { font-size:20px; color:#8a8d99; margin-left:2px; }
  .phase { text-align:right; }
  .phase .lbl { font-size:10px; letter-spacing:.22em; color:#8a8d99; text-transform:uppercase; }
  .phase .val { font-size:22px; font-weight:600; letter-spacing:.04em; margin-top:3px; }

  .scale { position:relative; height:16px; border-radius:3px; background:#15161d;
    border:1px solid #23252f; overflow:hidden; }
  .scale .band { position:absolute; top:0; bottom:0; background:rgba(255,255,255,.045);
    border-left:1px dashed rgba(255,255,255,.2); border-right:1px dashed rgba(255,255,255,.2); }
  .scale .fill { position:absolute; top:0; bottom:0; left:0;
    background:linear-gradient(90deg,#4aa3ff,#ffb469); }
  .scale .cursor { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff;
    box-shadow:0 0 8px #fff; }
  .ticks { position:relative; height:26px; margin-top:5px; font-size:9.5px; letter-spacing:.14em;
    color:#8a8d99; }
  .ticks i { position:absolute; transform:translateX(-50%); font-style:normal; text-align:center;
    white-space:nowrap; }
  .ticks i b { display:block; color:#d9d5cd; font-weight:600; font-size:10px; letter-spacing:.1em; }
  .bandlabel { position:absolute; top:0; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:.2em; color:#6f7280; white-space:nowrap; }

  .nodebar { margin-top:16px; opacity:0; transition:opacity .25s; }
  .nodebar.on { opacity:1; }
  .nodebar .cap { display:flex; justify-content:space-between; font-size:10px; letter-spacing:.2em;
    color:#ffb469; text-transform:uppercase; margin-bottom:5px; }
  .nodebar .track { height:4px; background:#15161d; border-radius:2px; overflow:hidden; }
  .nodebar .bar { height:100%; width:0; background:#ffb469; box-shadow:0 0 12px #ff8c3c; }

  /* ═══ khoảnh khắc chính ═══ */
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #burst { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%);
    text-align:center; opacity:0; }
  #burstK { font-size:13px; letter-spacing:.42em; color:#ffb469; text-transform:uppercase; }
  #burstT { font-size:34px; font-weight:700; letter-spacing:.08em; margin-top:6px; }

  /* ═══ thẻ nội dung ═══ */
  #veil { position:fixed; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:rgba(5,6,10,.9); backdrop-filter:blur(6px); padding:24px; }
  #veil.hide { display:none; }
  #card { width:min(680px,100%); max-height:calc(100vh - 48px); overflow-y:auto;
    background:#0d0f15; border:1px solid #23252f; border-radius:10px; padding:30px 32px; }
  #card .eyebrow { font-size:10.5px; letter-spacing:.3em; color:#ffb469; text-transform:uppercase; }
  #card h1 { font-size:27px; font-weight:600; letter-spacing:-.01em; margin:10px 0 14px;
    line-height:1.25; }
  #card h2 { font-size:15px; font-weight:600; margin:22px 0 8px; color:#f2efe9; }
  #card p { font-size:14.5px; line-height:1.65; color:#b9bcc6; margin:0 0 12px; }
  #card dl { margin:0; }
  #card dt { font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:#ffb469;
    margin-top:14px; }
  #card dd { margin:5px 0 0; font-size:14.5px; line-height:1.6; color:#b9bcc6; }
  .quote { border-left:2px solid #ffb469; padding-left:16px; margin:20px 0 0;
    font-size:14.5px; line-height:1.65; color:#d9d5cd; font-style:italic; }
  .quote cite { display:block; margin-top:8px; font-style:normal; font-size:12px; color:#757884;
    letter-spacing:.04em; }
  .keys { display:flex; flex-wrap:wrap; gap:10px 22px; margin:18px 0 6px; font-size:13px;
    color:#9b9ea9; }
  .keys kbd { margin-right:6px; padding:2px 7px; }
  .go { margin-top:26px; display:inline-block; font:inherit; font-size:13px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:#07080c; background:#ffb469;
    border:0; border-radius:5px; padding:12px 26px; cursor:pointer; }
  .go:hover { background:#ffc68d; }
  .note { margin-top:16px; font-size:12px; color:#6f7280; line-height:1.55; }

  /* ═══ sảnh: thẻ chọn phòng ═══ */
  .roomGrid { display:grid; gap:10px; margin-top:4px; }
  .roomCard { position:relative; text-align:left; font:inherit; cursor:pointer;
    background:#12141b; border:1px solid #23252f; border-radius:8px; padding:16px 18px;
    color:#e8e6e1; transition:border-color .2s, background .2s; }
  .roomCard:hover { border-color:#ffb469; background:#171a22; }
  .roomCard .rc-k { display:block; font-size:10px; letter-spacing:.22em; color:#8a8d99;
    text-transform:uppercase; }
  .roomCard .rc-t { display:block; font-size:17px; font-weight:600; margin-top:5px; }
  .roomCard .rc-d { display:block; font-size:13px; color:#9b9ea9; margin-top:4px; line-height:1.5; }
  .roomCard .rc-done { position:absolute; top:16px; right:18px; font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; color:#07080c; background:#7bc47f; border-radius:3px; padding:3px 7px; }
  .roomCard.done { border-color:#2f4a33; }

  /* ═══ sổ tay biện chứng ═══ */
  #book { position:fixed; inset:0; z-index:25; display:none; align-items:center;
    justify-content:center; background:rgba(5,6,10,.93); backdrop-filter:blur(6px); padding:24px; }
  #book.on { display:flex; }
  #bookInner { width:min(680px,100%); max-height:calc(100vh - 48px); overflow-y:auto;
    background:#0d0f15; border:1px solid #23252f; border-radius:10px; padding:30px 32px; }
  #bookInner > h2 { font-size:22px; font-weight:600; margin:0 0 6px; }
  #bookInner > .sub { font-size:12px; color:#6f7280; margin:0 0 20px; letter-spacing:.04em; }
  .entry { border-top:1px solid #1d1f28; padding-top:16px; margin-top:16px; }
  .entry:first-of-type { border-top:0; padding-top:0; margin-top:0; }
  .entry h3 { font-size:15px; font-weight:600; margin:0 0 6px; color:#ffb469; }
  .entry p { font-size:14px; line-height:1.6; color:#b9bcc6; margin:0; }
  .entry blockquote { border-left:2px solid #2d3040; padding-left:14px; margin:10px 0 0;
    font-size:13.5px; line-height:1.6; color:#9b9ea9; font-style:italic; }
  .entry blockquote cite { display:block; margin-top:6px; font-style:normal; font-size:11.5px;
    color:#5f6270; }
  #bookList .empty { font-size:14px; color:#6f7280; }

  #err { position:fixed; inset:0; z-index:40; display:none; align-items:center;
    justify-content:center; padding:24px; background:#07080c; }
  #err.on { display:flex; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div id="roomTag"><div id="tagKicker"></div><div id="tagTitle"></div></div>
  <div id="cross"></div>
  <div id="hint"></div>
  <div id="panel"></div>
  <div id="flash"></div>
  <div id="burst"><div id="burstK"></div><div id="burstT"></div></div>
</div>

<div id="veil"><div id="card"></div></div>

<div id="book">
  <div id="bookInner">
    <h2>Sổ tay biện chứng</h2>
    <p class="sub">Nhấn <kbd>Tab</kbd> để đóng</p>
    <div id="bookList"></div>
  </div>
</div>

<div id="err"><div class="errCard" style="width:min(600px,100%);background:#0d0f15;border:1px solid #23252f;border-radius:10px;padding:30px 32px">
  <div class="eyebrow">Thiếu thư viện</div>
  <h1>Không nạp được three.min.js</h1>
  <p>File <code>three.min.js</code> phải nằm cùng thư mục với trang này. Tải lại bằng:</p>
  <p class="note" style="font-family:monospace;font-size:12.5px">curl -L -o three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js</p>
</div></div>

<script src="three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    document.getElementById('err').classList.add('on');
    document.getElementById('veil').classList.add('hide');
  }
</script>

<script src="content/vi.js"></script>
<script src="engine/anim.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/hud.js"></script>
<script src="engine/player.js"></script>
<script src="engine/room.js"></script>
<script src="engine/core.js"></script>

<script src="rooms/sanh.js"></script>
<script src="rooms/bien-chung.js"></script>
<script src="rooms/luong-chat.js"></script>
<script src="rooms/mau-thuan.js"></script>
<script src="rooms/phu-dinh.js"></script>
<script src="rooms/ha-tang.js"></script>

<script>
  if (typeof THREE !== 'undefined') TX.khoiTao();
</script>
</body>
</html>
